name: Release

# Two ways in:
#  - push to main touching binary-relevant paths → auto patch bump (v0.1.3 → v0.1.4)
#  - push a v* tag by hand → release exactly that version (minor/major bumps)
# One workflow on purpose: tags pushed by a workflow's GITHUB_TOKEN never
# trigger other workflows, so a separate auto-tagger would never build.

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            LATEST=${LATEST:-v0.0.0}
            IFS=. read -r MAJ MIN PAT <<< "${LATEST#v}"
            TAG="v${MAJ}.${MIN}.$((PAT + 1))"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o "gv_${GOOS}_${GOARCH}" ./cmd/gv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gv_${{ matrix.goos }}_${{ matrix.goarch }}
          path: gv_*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: binaries/*
          generate_release_notes: true
