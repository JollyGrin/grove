# Grove config — copy to ~/.config/grove/config.yaml (or just run `gv init`
# inside a repo: it registers the repo and scaffolds .grove/tasks/ for you).
#
# repos.<name>:
#   path:          main checkout (worktrees land in <parent>/.worktrees/<repo>/)
#   base:          branch to fork from (default: main)
#   setup:         run in fresh worktrees, serialized per-repo (optional)
#   claude:        worker command (default: claude --dangerously-skip-permissions)
#   prompt:        kickoff template override (optional; embedded default otherwise)
#   provider:      per-repo task backend override (markdown|linear|github; default: global kind)
#   linear_labels: ticket labels that map to this repo for `gv grab` (linear provider)

# Task backend. github: the repo's GitHub issues via `gh` (ids <repo>-<n>;
# agents transition via labels; the human's merge closes the issue).
# markdown (default): one file per task in <repo>/.grove/tasks/,
# YAML frontmatter (id/title/status/…) + markdown body — `gv grab` with no
# args lists the grabbable backlog. linear: the Grid-era Linear client.
provider:
  kind: markdown
  markdown:
    dir: .grove/tasks     # relative to each repo

# Only read when provider.kind is linear.
linear:
  api_key_env: LINEAR_API_KEY
  team: DEV

repos:
  myapp:
    path: ~/git/myapp
    base: main
    setup: pnpm install
  # Grid-era example (linear provider):
  # monorepo:
  #   path: ~/git/thegrid/thegrid-private-monorepo
  #   base: main
  #   # worktree:setup copies env files + installs + builds, but can't rebuild
  #   # gitignored graphql codegen output — copy it from the main checkout
  #   # first (field-tested 2026-06-10, see LEARNINGS.md)
  #   setup: bash -c 'M="$(cd "$(git rev-parse --git-common-dir)/.." && pwd)"; cp -R "$M/packages/graphql/generated" packages/graphql/ 2>/dev/null || true; pnpm worktree:setup'
  #   linear_labels: [management-portal, admin-portal, directory]

# Workspace-scoped: a workspace cockpit reads only its own
# <root>/.grove/config.yaml orchestrator block (this global one is for the
# legacy global cockpit and is never inherited by workspaces).
orchestrator:
  dir: ~/.config/grove/orchestrator
  claude: claude --dangerously-skip-permissions   # default; guardrails live in the orchestrator's CLAUDE.md

audit:
  stale_days: 7   # no-PR tasks with a dead/idle agent older than this classify `abandoned`

notify:
  # Phone push via ntfy (free, no account): subscribe to the topic in the
  # ntfy iOS/Android app. The topic name is the ONLY secret — use ≥16
  # random chars, or point at a self-hosted server. Fires for
  # QUESTION/BLOCKED/DONE/needs-input only; empty = off.
  ntfy: ""                # e.g. https://ntfy.sh/grove-<long-random-suffix>
  ntfy_body: full         # `title-only` keeps sentinel text off the public server

cost:
  # stuck_turns: 30      # turns with no delivery movement before a stuck flag
  # pricing:             # per-model USD/MTok overrides (estimates only)
  #   claude-sonnet-5: {input: 3, output: 15}
  # Persistent spend ledger (<state>/ledger.csv): record snapshots so cost
  # history survives Claude Code transcript pruning (~30 days) and worktree
  # removal. This is only the DEFAULT — the cockpit costs page ($ key, then
  # r) toggles at runtime, persisted in <state>/cost-recording, which wins.
  record: false
