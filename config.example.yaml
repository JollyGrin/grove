# Grove config — copy to ~/.config/grove/config.yaml (or just run `gv init`
# inside a repo: it registers the repo and scaffolds .grove/tasks/ for you).
#
# repos.<name>:
#   path:          main checkout (worktrees land in <parent>/.worktrees/<repo>/)
#   base:          branch to fork from (default: main)
#   setup:         run in fresh worktrees, serialized per-repo (optional)
#   claude:        worker command (default: claude --dangerously-skip-permissions)
#   prompt:        kickoff template override (optional; embedded default otherwise)
#                  for one-off ad-hoc instructions instead, use
#                  `gv grab <id> --brief "<text>"` — appended as a final
#                  "## Operator brief" section, no config edit needed
#   provider:      per-repo task backend override (markdown|linear|github; default: global kind)
#   model_profile: default model_profiles entry for this repo's workers (default: none = anthropic)
#   linear_labels: ticket labels that map to this repo for `gv grab` (linear provider)

# Task backend. github: the repo's GitHub issues via `gh` (ids <repo>-<n>;
# agents transition via labels; the human's merge closes the issue).
# markdown (default): one file per task in <repo>/.grove/tasks/,
# YAML frontmatter (id/title/status/…) + markdown body — `gv grab` with no
# args lists the grabbable backlog. linear: the Grid-era Linear client.
provider:
  kind: markdown
  markdown:
    dir: .grove/tasks     # relative to each repo

# Only read when provider.kind is linear.
linear:
  api_key_env: LINEAR_API_KEY
  team: DEV

# Optional remote grove hosts (grove-176): `gv grab <task> --host <name>` /
# `gv ls --host <name>` ssh to the host and run its gv with the flags passed
# through verbatim. No state sync — the host keeps its own config/state,
# GitHub is the only shared layer. `gv doctor` probes each one.
# hosts:
#   grove-host:
#     ssh: dean@grove-host        # any ssh target; Tailscale MagicDNS in practice
#     gv: /home/dean/go/bin/gv    # absolute path on the host (default: gv)

repos:
  myapp:
    path: ~/git/myapp
    base: main
    setup: pnpm install
  # Grid-era example (linear provider):
  # monorepo:
  #   path: ~/git/thegrid/thegrid-private-monorepo
  #   base: main
  #   # worktree:setup copies env files + installs + builds, but can't rebuild
  #   # gitignored graphql codegen output — copy it from the main checkout
  #   # first (field-tested 2026-06-10, see LEARNINGS.md)
  #   setup: bash -c 'M="$(cd "$(git rev-parse --git-common-dir)/.." && pwd)"; cp -R "$M/packages/graphql/generated" packages/graphql/ 2>/dev/null || true; pnpm worktree:setup'
  #   linear_labels: [management-portal, admin-portal, directory]

# Workspace-scoped: a workspace cockpit reads only its own
# <root>/.grove/config.yaml orchestrator block (this global one is for the
# legacy global cockpit and is never inherited by workspaces).
orchestrator:
  dir: ~/.config/grove/orchestrator
  claude: claude --dangerously-skip-permissions   # default; guardrails live in the orchestrator's CLAUDE.md
  # hotkeys:            # cockpit digit hotkeys (grove-105): the digit spawns that
  #   "1": openrouter-glm   # profile's orchestrator directly. Bind/unbind from the
  #   "2": openrouter-kimi  # `)` picker (which always opens when any profile exists) —
  #                         # the picker writes this block back for you.

# Workspace-scoped, like orchestrator above and for a sharper reason
# (grove-227): claude_config_dir names WHICH Claude Code config dir holds a
# workspace's transcripts — i.e. which subscription `gv chat` reads. Set it
# ONLY in a workspace's own <root>/.grove/config.yaml, and only where that
# workspace's orchestrator.claude is a wrapper exporting a different
# CLAUDE_CONFIG_DIR (a work-sub wrapper, say). merge.go drops it from this
# global layer, so no hobby workspace can inherit a work profile's reader.
# Unset (the normal case) = GV_CLAUDE_CONFIG_DIR, else ~/.claude.
# claude_config_dir: ~/.cc-work

audit:
  stale_days: 7   # no-PR tasks with a dead/idle agent older than this classify `abandoned`
  idle_after: 30m # done/waiting workers quiet longer than this classify `idle` (suggest `gv pause`); zero/invalid falls back to 30m

notify:
  # Phone push via ntfy (free, no account): subscribe to the topic in the
  # ntfy iOS/Android app. The topic name is the ONLY secret — use ≥16
  # random chars, or point at a self-hosted server. Fires for
  # QUESTION/BLOCKED/DONE/needs-input only; empty = off.
  ntfy: ""                # e.g. https://ntfy.sh/grove-<long-random-suffix>
  ntfy_body: full         # `title-only` keeps sentinel text off the public server

# Model profiles (grove-36): run a worker or orchestrator against any
# Anthropic-API-compatible backend instead of the operator's own Claude sub —
# OpenRouter's "Anthropic Skin" (native /v1/messages) is the reference case.
# Secrets are NEVER stored here: auth_token_env names an env VAR (read from
# ~/.config/grove/.env, perms 600), never the key itself. Absent/empty =
# today's behavior, byte-for-byte.
#   gv grab <ticket> --repo myapp --profile openrouter-glm
#   gv orchestrator new --profile openrouter-glm
# model_profiles:
#   openrouter-glm:
#     base_url: https://openrouter.ai/api
#     auth_token_env: OPENROUTER_API_KEY
#     opus:   z-ai/glm-5.2
#     sonnet: z-ai/glm-5.2
#     haiku:  z-ai/glm-4.5-air
#   kimi:
#     base_url: https://api.kimi.com/coding
#     auth_token_env: KIMI_CODE_API_KEY
#     opus:   "k3[1m]"
#     sonnet: "k3[1m]"
#     haiku:  "k3[1m]"
#     env:    # backend-specific vars beyond the six built-ins; built-ins win on collision
#       CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1048576"
#       ENABLE_TOOL_SEARCH: "false"

cost:
  # stuck_turns: 30      # turns with no delivery movement before a stuck flag
  # pricing:             # per-model USD/MTok overrides (estimates only)
  #   claude-sonnet-5: {input: 3, output: 15}
  #   z-ai/glm-5.2: {input: 0.42, output: 1.32}     # OpenRouter metered $, not an effort-estimate
  # Persistent spend ledger (<state>/ledger.csv): record snapshots so cost
  # history survives Claude Code transcript pruning (~30 days) and worktree
  # removal. This is only the DEFAULT — the cockpit costs page ($ key, then
  # r) toggles at runtime, persisted in <state>/cost-recording, which wins.
  record: false

# Cockpit presentation (grove-22).
cockpit:
  # Joy knob for the dashboard TUI:
  #   full  (default) — calm ambient life (breathing agents, grove verbs,
  #                      weather gauge, time-of-day empty states) + one-shot
  #                      merge/done celebrations.
  #   calm            — ambient only, no celebrations.
  #   off             — today's exact render, no flourish.
  # Cycle at runtime with the `*` key (not persisted). Unknown value = full.
  # effects: full

  # Cockpit pane split (grove-52) — seeds the session's @grove_layout at
  # build time:
  #   horizontal (default) — dash + chats as equal side-by-side columns.
  #   vertical             — dash a wide 55% left pane, chats stacked right.
  #   tiled                — even grid.
  # Cycle at runtime with the `L` key (persists for the session's life).
  # Unknown value = horizontal.
  # layout: horizontal
